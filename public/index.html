<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Application web pour rechercher et découvrir des prénoms de bébé"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json fournit les métadonnées utilisées lorsque votre application web est installée sur
      l'appareil mobile ou l'ordinateur d'un utilisateur. Voir https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notez l'utilisation de %PUBLIC_URL% dans les balises ci-dessus.
      Elle sera remplacée par l'URL du dossier `public` lors de la compilation.
      Seuls les fichiers à l'intérieur du dossier `public` peuvent être référencés depuis le HTML.

      Contrairement à "/favicon.ico" ou "favicon.ico", "%PUBLIC_URL%/favicon.ico" fonctionnera
      correctement avec le routage côté client et une URL publique non racine.
      Apprenez à configurer une URL publique non racine en exécutant `npm run build`.
    -->
    <title>Application de prénoms de bébé</title>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour exécuter cette application.</noscript>
    <div id="root"></div>
    <!--
      Ce fichier HTML est un modèle.
      Si vous l'ouvrez directement dans le navigateur, vous verrez une page vide.

      Vous pouvez ajouter des polices web, des balises meta ou des outils d'analyse dans ce fichier.
      L'étape de compilation placera les scripts groupés dans la balise <body>.

      Pour commencer le développement, exécutez `npm start` ou `yarn start`.
      Pour créer un paquet de production, utilisez `npm run build` ou `yarn build`.
    -->
  </body>
</html>
